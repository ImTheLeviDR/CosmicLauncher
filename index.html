<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Launcher</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #04040d;
      --panel: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.07);
      --accent: #e8622a;
      --accent2: #f0a842;
      --text: #f0ece4;
      --muted: #6b6860;
      --glow: rgba(232, 98, 42, 0.35);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: default;
      user-select: none;
    }

    #nebula {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.55;
    }

    .grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 1;
    }

    .titlebar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      -webkit-app-region: drag;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(4, 4, 13, 0.6);
      backdrop-filter: blur(12px);
    }

    .tb-left {
      display: flex;
      align-items: center;
    }

    .tb-name {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .tb-controls {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .tb-btn {
      width: 32px;
      height: 26px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .tb-btn:hover {
      color: var(--text);
      background: var(--panel);
    }

    .tb-btn.close:hover {
      background: rgba(220, 50, 50, 0.7);
      border-color: rgba(220, 50, 50, 0.9);
      color: #fff;
    }

    .layout {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 420px 1fr;
      padding-top: 44px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px;
      border-left: 1px solid var(--border);
    }

    .planet-wrap {
      position: relative;
      width: 320px;
      height: 320px;
      margin-bottom: 32px;
    }

    .planet {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 32% 28%, rgba(240, 168, 66, 0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 65%, rgba(232, 98, 42, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #1a0e06 0%, #0d0505 60%, #04040d 100%);
      box-shadow:
        inset -40px -20px 80px rgba(0, 0, 0, 0.8),
        inset 20px 15px 60px rgba(240, 168, 66, 0.1),
        0 0 80px rgba(232, 98, 42, 0.2),
        0 0 160px rgba(232, 98, 42, 0.08);
      position: relative;
      overflow: hidden;
      animation: planet-drift 18s ease-in-out infinite;
    }

    @keyframes planet-drift {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      33% {
        transform: translateY(-8px) rotate(0.5deg);
      }

      66% {
        transform: translateY(5px) rotate(-0.3deg);
      }
    }

    .planet::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(172deg,
          transparent 0%, transparent 8%,
          rgba(180, 80, 20, 0.06) 8%, rgba(180, 80, 20, 0.06) 9%,
          transparent 9%, transparent 17%,
          rgba(120, 50, 10, 0.05) 17%, rgba(120, 50, 10, 0.05) 18.5%);
      border-radius: 50%;
    }

    .planet::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: transparent;
      box-shadow: inset 0 0 40px 20px rgba(232, 98, 42, 0.12);
      pointer-events: none;
    }

    .planet-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 440px;
      height: 90px;
      transform: translate(-50%, -50%) rotateX(75deg);
      border-radius: 50%;
      border: 14px solid transparent;
      border-top-color: rgba(240, 168, 66, 0.35);
      border-bottom-color: rgba(232, 98, 42, 0.15);
      box-shadow: 0 0 30px rgba(240, 168, 66, 0.1);
      pointer-events: none;
      animation: ring-glow 4s ease-in-out infinite;
    }

    @keyframes ring-glow {

      0%,
      100% {
        border-top-color: rgba(240, 168, 66, 0.35);
      }

      50% {
        border-top-color: rgba(240, 168, 66, 0.55);
      }
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 380px;
      height: 380px;
      transform: translate(-50%, -50%);
      animation: orbit-spin 12s linear infinite;
    }

    .moon {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c8b89a, #6b5a45);
      box-shadow: 0 0 12px rgba(200, 184, 154, 0.4);
    }

    @keyframes orbit-spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    .planet-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 32px 48px 48px;
      border-right: 1px solid var(--border);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.025) 0%, transparent 100%);
      gap: 0;
    }

    .game-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .game-title {
      font-size: 2rem;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(130deg, var(--text) 40%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      margin-bottom: 36px;
      opacity: 0.4;
    }

    .field-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* ── PLAY BUTTON ── */
    .play-wrap {
      position: relative;
      margin-bottom: 28px;
    }

    .play-btn {
      width: 100%;
      height: 54px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 24px rgba(232, 98, 42, 0.3), 0 1px 0 rgba(255, 255, 255, 0.15) inset;
      display: flex;
      align-items: center;
    }

    .play-btn-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 24px;
      position: relative;
      height: 100%;
    }

    .play-btn-main::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
      transition: left 0.55s ease;
    }

    .play-btn:hover .play-btn-main::before {
      left: 150%;
    }

    /* ── VERSION SIDE of the button ── */
    .play-btn-version {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 72px;
      flex-shrink: 0;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      gap: 2px;
      transition: background 0.2s;
      padding: 0 8px;
      cursor: pointer;
      height: 100%;
    }

    .play-btn-version:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Version number shown inside the button */
    .play-btn-ver-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1;
    }

    /* Chevron icon */
    .play-btn-ver-icon {
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1;
    }

    .play-btn:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(232, 98, 42, 0.5), 0 1px 0 rgba(255, 255, 255, 0.2) inset;
      background: #f07040;
    }

    .play-btn:active {
      transform: translateY(1px);
    }

    .play-btn:disabled {
      cursor: default;
      opacity: 0.85;
    }

    .play-btn.launching {
      animation: launch-pulse 0.4s ease;
    }

    @keyframes launch-pulse {
      0% {
        box-shadow: 0 0 0px rgba(232, 98, 42, 0.8);
      }

      50% {
        box-shadow: 0 0 60px rgba(232, 98, 42, 0.9), 0 0 100px rgba(240, 168, 66, 0.4);
      }

      100% {
        box-shadow: 0 4px 24px rgba(232, 98, 42, 0.3);
      }
    }

    /* ── VERSION POPUP ── */
    .version-popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, backdrop-filter 0.25s ease, visibility 0.25s;
      backdrop-filter: blur(0px);
    }

    .version-popup.show {
      opacity: 1;
      visibility: visible;
      pointer-events: all;
      backdrop-filter: blur(8px);
    }

    .version-popup-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .version-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      transform: scale(0.92);
      transition: transform 0.25s ease;
    }

    .version-popup.show .version-cards {
      transform: scale(1);
    }

    .version-card {
      padding: 18px 28px;
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 280px;
      position: relative;
      overflow: hidden;
    }

    .version-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .version-card:hover::before {
      left: 100%;
    }

    .version-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      transform: translateX(8px) scale(1.02);
      box-shadow: 0 0 20px rgba(232, 98, 42, 0.2), 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .version-card:active {
      transform: translateX(8px) scale(0.98);
    }

    .version-card.selected {
      background: rgba(232, 98, 42, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 16px rgba(232, 98, 42, 0.3), 0 0 0 1px var(--accent) inset;
    }

    .version-card-check {
      opacity: 0;
      color: var(--accent);
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .version-card.selected .version-card-check {
      opacity: 1;
      transform: scale(1);
    }

    .version-close {
      align-self: flex-end;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      padding: 4px 8px;
      margin-bottom: 4px;
    }

    .version-close:hover {
      color: var(--text);
    }

    .particles-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>

<body>

  <canvas id="nebula"></canvas>
  <div class="grain"></div>

  <div class="titlebar">
    <div class="tb-left">
      <span class="tb-name">Cosmic Launcher</span>
    </div>
    <div class="tb-controls">
      <button class="tb-btn" onclick="minimize()">&#x2212;</button>
      <button class="tb-btn close" onclick="closeLauncher()">&times;</button>
    </div>
  </div>

  <canvas class="particles-canvas" id="particles"></canvas>

  <div class="layout">

    <!-- Left: Controls -->
    <div class="right-panel">
      <div class="game-title">Cosmic<br>Launcher</div>
      <div class="game-subtitle">A beautiful lightweight launcher</div>

      <div class="divider"></div>

      <div class="play-wrap">
        <button class="play-btn" id="playBtn">
          <div class="play-btn-main" id="playBtnLabel">&#x25B6; &nbsp; Launch</div>
          <!--
            FIX 1: replaced the raw ⋮ dots button with a version display panel.
            Now shows the active version number + a chevron, so the right section
            feels semantically connected to the version picker instead of being a
            mysterious three-dot menu.
          -->
          <div class="play-btn-version" id="playBtnDots">
            <span class="play-btn-ver-label" id="playBtnVerLabel">1.20.4</span>
            <span class="play-btn-ver-icon">&#x25BE;</span>
          </div>
        </button>
      </div>

      <div class="version-popup" id="versionPopup" onclick="handlePopupBackdropClick(event)">
        <div class="version-popup-inner">
          <div class="version-close" onclick="closeVersionPopup()">&times;</div>
          <div class="version-cards">
            <div class="version-card selected" data-v="1.20.4" onclick="selectVersion(this)">
              <span>1.20.4</span>
              <span class="version-card-check">&#x2713;</span>
            </div>
            <div class="version-card" data-v="1.20.1" onclick="selectVersion(this)">
              <span>1.20.1</span>
              <span class="version-card-check">&#x2713;</span>
            </div>
            <div class="version-card" data-v="1.19.4" onclick="selectVersion(this)">
              <span>1.19.4</span>
              <span class="version-card-check">&#x2713;</span>
            </div>
            <div class="version-card" data-v="1.18.2" onclick="selectVersion(this)">
              <span>1.18.2</span>
              <span class="version-card-check">&#x2713;</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Planet -->
    <div class="left-panel">
      <div class="planet-wrap">
        <div class="orbit">
          <div class="moon"></div>
        </div>
        <div class="planet"></div>
        <div class="planet-ring"></div>
      </div>
      <div class="planet-label">Sector VII — Aetheria System</div>
    </div>

  </div>

  <script>
    /* ── NEBULA CANVAS ── */
    (function () {
      const canvas = document.getElementById('nebula');
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      const blobs = Array.from({ length: 7 }, (_, i) => ({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: 200 + Math.random() * 320, hue: i < 3 ? 22 + Math.random() * 18 : 260 + Math.random() * 40,
        speed: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.08,
        phase: Math.random() * Math.PI * 2, alpha: 0.04 + Math.random() * 0.07,
      }));
      const stars = Array.from({ length: 200 }, () => ({
        x: Math.random() * 2000, y: Math.random() * 1200,
        r: Math.random() * 1.5, a: 0.2 + Math.random() * 0.8, phase: Math.random() * Math.PI * 2,
      }));
      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t += 0.006;
        stars.forEach(s => {
          const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 1.5 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x % canvas.width, s.y % canvas.height, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,245,220,${s.a * twinkle})`; ctx.fill();
        });
        blobs.forEach(b => {
          b.x += b.speed; b.y += b.vy;
          if (b.x > canvas.width + b.r) b.x = -b.r;
          if (b.x < -b.r) b.x = canvas.width + b.r;
          if (b.y > canvas.height + b.r) b.y = -b.r;
          if (b.y < -b.r) b.y = canvas.height + b.r;
          const pulse = 1 + 0.05 * Math.sin(t + b.phase);
          const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * pulse);
          grad.addColorStop(0, `hsla(${b.hue},80%,55%,${b.alpha * 1.5})`);
          grad.addColorStop(0.5, `hsla(${b.hue},70%,40%,${b.alpha * 0.5})`);
          grad.addColorStop(1, `hsla(${b.hue},60%,20%,0)`);
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
          ctx.fillStyle = grad; ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── PARTICLES ── */
    (function () {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
      const particles = [];
      window.spawnParticles = function (x, y) {
        for (let i = 0; i < 28; i++) {
          const angle = Math.random() * Math.PI * 2, speed = 2 + Math.random() * 5;
          particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, r: 2 + Math.random() * 3, hue: 20 + Math.random() * 30 });
        }
      };
      (function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life -= 0.025;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue},90%,65%,${p.life})`; ctx.fill();
        }
        requestAnimationFrame(loop);
      })();
    })();

    /* ── VERSION POPUP ── */
    let selectedVersion = '1.20.4';
    let popupVisible = false;

    function openVersionPopup() {
      popupVisible = true;
      document.getElementById('versionPopup').classList.add('show');
    }
    function closeVersionPopup() {
      popupVisible = false;
      document.getElementById('versionPopup').classList.remove('show');
    }
    function handlePopupBackdropClick(event) {
      if (event.target === document.getElementById('versionPopup')) closeVersionPopup();
    }
    function selectVersion(el) {
      document.querySelectorAll('.version-card').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedVersion = el.dataset.v;
      // FIX 2: update the version label inside the button when a new version is chosen
      document.getElementById('playBtnVerLabel').textContent = selectedVersion;
      setTimeout(closeVersionPopup, 300);
    }

    /* ── WIRE UP BUTTONS ── */
    document.getElementById('playBtnDots').addEventListener('click', function (e) {
      e.stopPropagation();
      popupVisible ? closeVersionPopup() : openVersionPopup();
    });

    document.getElementById('playBtnLabel').addEventListener('click', function (e) {
      e.stopPropagation();
      play();
    });

    /* ── PLAY ── */
    function play() {
      const btn = document.getElementById('playBtn');
      const label = document.getElementById('playBtnLabel');
      const dots = document.getElementById('playBtnDots');
      if (btn.disabled) return;
      const rect = btn.getBoundingClientRect();
      window.spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
      btn.classList.remove('launching');
      void btn.offsetWidth;
      btn.classList.add('launching');
      label.innerHTML = '&#x27F3; &nbsp; Loading...';
      dots.style.display = 'none';
      btn.disabled = true;
      setTimeout(() => {
        closeLauncher();
      }, 2200);
    }

    /* ── WINDOW CONTROLS ── */
    function minimize() { try { window.require('electron').ipcRenderer.send('minimize'); } catch (_) { } }
    function closeLauncher() { try { window.require('electron').ipcRenderer.send('close'); } catch (_) { } }
  </script>
</body>

</html>
